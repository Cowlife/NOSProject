<div class="flex-container">
  <p-button label="My Team" severity="success" />
  <p-button label="Favorite Pokemon List" (click)="drawer_visibility = true" severity="info" />
  <p-button label="Logout" severity="danger" (onClick)="this.pokemonService.changePage('')" />
</div>

<p-drawer [(visible)]="drawer_visibility" [modal]="true">
  <h3 style="text-align: center">Favorite Pokemon List</h3>
  <div *ngFor="let fav_pokemon of this.pokemonService.favorite_pokemon">
    <p-card>
      <p-button [outlined]="true" (click)="showDialog(fav_pokemon)">
        <img [src]="fav_pokemon.pokemonImage" alt="Image" width="96">
      </p-button>
      {{fav_pokemon.favoritePokemonName}}
      <div>
        <p-button [disabled]="true"
                  [label]="splitStringByComma(fav_pokemon.pokemonTypes, 0)"/>
        <p-button [disabled]="true" *ngIf="splitStringByComma(fav_pokemon.pokemonTypes, 1) != null "
                  [label]="splitStringByComma(fav_pokemon.pokemonTypes, 1)"/>
      </div>
      <p-button class="favorite-button" (onClick)="deleteElement(fav_pokemon)"
                icon="pi pi-heart-fill" [rounded]="true" [text]="true"/>

    </p-card>
  </div>
</p-drawer>

<p-dialog
  header="Pokemon Info"
  [modal]="true"
  [(visible)]="dialog_visibility"
  [style]="{ width: '50rem' }"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">

  <p-button [disabled]="true"
            [label]="splitStringByComma(this.current_pokemon.pokemonTypes, 0)"/>
  <p-button [disabled]="true" *ngIf="splitStringByComma(this.current_pokemon.pokemonTypes, 1) != null "
            [label]="splitStringByComma(this.current_pokemon.pokemonTypes, 1)"/>
  <div class="dialog-flex_container">
    <div style="flex-shrink: 2">
      <p-card class="p-card_styling">
        <img [src]="this.current_pokemon.pokemonImage" alt="Image" width="96">
        <h4>{{this.current_pokemon.favoritePokemonName}}</h4>
      </p-card>
    </div>
    <div style="flex-grow: 1">2</div>
    <div style="flex-grow: 1">3</div>
  </div>
  <div class="dialog-flex_container">
    <div style="flex-grow: 1">

    </div>
  </div>
</p-dialog>

<router-outlet/>
