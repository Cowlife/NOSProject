<p-dialog
  (visibleChange)="change_dialog_visibility.emit(false)"
  header="Pokemon Info"
  [modal]="true"
  (onShow)="setMoveTable()"
  [(visible)]="dialog_visibility"
  [style]="{ width: '80rem' }"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">

  <div class="dialog-flex_container">
    <div style="flex-grow: 1">
      <p-card>
        <img *ngIf="current_extracted_data?.sprites"
             [src]="this.current_extracted_data.sprites.front_default" alt="Image" width="96">
        <h4>{{this.current_extracted_data.name}}</h4>
        <ng-container *ngIf="current_extracted_data?.types">
          <p-button [disabled]="true"
                    [label]="current_extracted_data.types[0].type.name"/>
          <p-button [disabled]="true" *ngIf="current_extracted_data.types[1]?.type"
                    [label]="current_extracted_data.types[1].type.name"/>
        </ng-container>
      </p-card>
    </div>
    <div class="p-card-image-flex-container" *ngIf="current_extracted_data?.sprites">
      <h3>Pokemon Sprites</h3>
      <p-card *ngFor="let image of setSpriteImages()" >
        <img [src]="image.value" alt="Image" width="96">
        <h4 style="width: 40%; margin: auto">{{image.label}}</h4>
      </p-card>
    </div>
  </div>
  <div class="dialog-flex_container">
    <div style="flex-grow: 1">
      <h3>Pokemon Moves</h3>
      <div class="card" style="padding: 10px">
        <p-table #dt
                 [stripedRows] = "true"
                 [columns]="retrieval_move_cols"
                 [value]="current_pokemon_move_list"
                 [paginator]="true"
                 [rows]="5"
                 [rowsPerPageOptions]="[5, 10, 20]"
                 responsiveLayout="scroll">
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th *ngFor="let col of columns">{{col.header}}</th>
            </tr>
            <!--<tr>
              <th [pSortableColumn]="col.field" *ngFor="let col of columns">
                  <p-columnFilter
                    type="text"
                    [field]="col.field"
                    [matchModeOptions]="this.pokemonTypes.matchModeOptions"
                    [matchMode]="FilterMatchMode.STARTS_WITH" />
                  <p-sortIcon [field]="col.field" />
              </th>
            </tr>-->
          </ng-template>
          <ng-template pTemplate="body" let-rowData let-columns="columns">
            <tr [pSelectableRow]="rowData">
              <td *ngFor="let col of columns; let i = index">
                <ng-container *ngIf="['name','type'].includes(col.field)">
                  {{setSpriteImageLabel(returnNonIconCellElement(rowData, col), true)}}
                </ng-container>
                <ng-container *ngIf="['damage_class','target'].includes(col.field)">
                  <fa-icon
                    [icon]="this.pokemonTypes.faAttackTypeMap[rowData[col.field].name]"
                    style="font-size: 26px">
                  </fa-icon>
                </ng-container>
                <ng-container *ngIf="!(['name','type','damage_class','target'].includes(col.field))">
                  {{returnNonIconCellElement(rowData, col)}}
                </ng-container>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
  <div class="dialog-flex_container">
    <div style="flex-grow: 1; background-color: #96e072 !important;">
      <h3>Pokemon Base Stats</h3>
      <p-chart type="bar" [data]="chart_data_options[0]"
               [options]="chart_data_options[1]" class="h-[30rem]" />
    </div>
  </div>
</p-dialog>
